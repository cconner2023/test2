name: Deploy Pages

# Publishes the already-built site that `npm run deploy` pushes to the
# gh-pages branch. NOTHING is built here — the bundle is built locally with
# the real .env, so CI never needs any secrets. This workflow only takes the
# prebuilt gh-pages branch contents and serves them through the Actions Pages
# path, avoiding GitHub's flaky legacy Jekyll build backend.
#
# Triggered automatically by `npm run deploy` (via `gh workflow run`), and can
# be re-run by hand from the Actions tab. It must run on workflow_dispatch
# (i.e. from main), NOT a push to gh-pages: push-triggered workflows are read
# from the pushed branch, and gh-pages carries only the built site — no
# .github/ — so a gh-pages push would never fire this workflow.

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One Pages deployment at a time; let an in-flight deploy finish rather than
# cancelling it (cancelling mid-publish can leave the site half-updated).
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy1.outputs.page_url || steps.deploy2.outputs.page_url }}
    steps:
      - name: Checkout gh-pages (prebuilt site)
        uses: actions/checkout@v4
        with:
          ref: gh-pages

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      # Publish, with one native retry. GitHub's Pages publish backend flakes
      # intermittently ("Deployment failed, try again later") even on a valid
      # artifact; a same-target retry after a short backoff clears it. Native
      # guarded steps only — no third-party action, so CI stays dependency-free.
      - name: Deploy to GitHub Pages (attempt 1)
        id: deploy1
        continue-on-error: true
        uses: actions/deploy-pages@v4

      - name: Back off before retry
        if: steps.deploy1.outcome == 'failure'
        run: sleep 30

      - name: Deploy to GitHub Pages (retry)
        id: deploy2
        if: steps.deploy1.outcome == 'failure'
        uses: actions/deploy-pages@v4
