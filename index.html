<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/test2/icon-144.png" />

  <!-- viewport-fit=cover: content extends into safe areas (notch/island). -->
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
  <meta name="format-detection" content="telephone=no">

  <!-- CSP injected at build time by vite plugin (not in dev — breaks HMR) -->
  <!--CSP_PLACEHOLDER-->

  <!-- Per-theme --color-* vars for the splash, extracted from App.css by the
       vite plugin so the pre-React splash matches the user's selected theme. -->
  <!--THEME_VARS-->

  <title>V%APP_VERSION%</title>

  <!-- Theme colors -->
  <meta name="theme-color" media="(prefers-color-scheme: light)" content="#ffffff">
  <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#1a1a1a">

  <!-- PWA capabilities -->
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes">

  <!-- black-translucent allows content to extend behind status bar on iOS -->
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Medical Operations">

  <!-- iOS touch icon (multiple sizes for best display) -->
  <link rel="apple-touch-icon" href="/test2/icon-192.png" />
  <link rel="apple-touch-icon" sizes="144x144" href="/test2/icon-144.png" />
  <link rel="apple-touch-icon" sizes="192x192" href="/test2/icon-192.png" />

  <!-- Windows tiles -->
  <meta name="msapplication-TileColor" content="#646cff" />
  <meta name="msapplication-TileImage" content="/test2/icon-144.png" />
  <!-- Windows splash screen -->
  <meta name="msapplication-starturl" content="/test2/">
  <meta name="msapplication-config" content="/test2/browserconfig.xml">

</head>

<body>
  <!-- Loading screen — fixed overlay, dismissed by main.tsx (min 800ms display) -->
  <style>
    html,
    body {
      margin: 0;
      padding: 0
    }

    /* Splash colors track the SELECTED theme via --color-* vars (made available
       at first paint by the <style id="splash-theme-vars"> the vite plugin
       extracts from App.css + the inline script setting data-theme). rgba
       fallbacks = default-light, used only if a var is somehow missing. */
    .splash {
      position: fixed;
      inset: 0;
      z-index: 9999;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: var(--color-themewhite2, rgba(240, 242, 245, 1));
      overflow: hidden;
      transition: opacity 0.5s ease-out
    }

    .splash.splash-out {
      opacity: 0;
      pointer-events: none
    }

    .splash-title {
      margin-top: 16px;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      font-size: 18px;
      font-weight: 600;
      letter-spacing: 2px;
      color: var(--color-themeblue3, rgba(0, 66, 92, 1))
    }

    .splash-bar-track {
      margin-top: 14px;
      width: 140px;
      height: 3px;
      border-radius: 2px;
      background: rgba(0, 66, 92, 0.1);
      overflow: hidden
    }

    .splash-bar-fill {
      height: 100%;
      width: 30%;
      background: var(--color-themeblue2, rgba(21, 142, 172, 1));
      border-radius: 2px;
      animation: splashPulse 1.2s ease-in-out infinite
    }

    .splash-subtitle {
      margin-top: 24px;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      font-size: 14px;
      color: rgba(0, 66, 92, 0.65)
    }

    @keyframes splashPulse {
      0% {
        transform: translateX(-100%)
      }
      100% {
        transform: translateX(467%)
      }
    }

    /* Dark-mode legacy text/track tweaks (HUD handles its own dark swap below). */
    [data-theme$="-dark"] .splash-title { color: var(--color-themeblue1, rgba(129, 161, 181, 1)) }
    [data-theme$="-dark"] .splash-bar-track { background: rgba(255, 255, 255, 0.15) }
    [data-theme$="-dark"] .splash-subtitle { color: var(--color-themeblue1, rgba(129, 161, 181, 0.8)) }

    /* ── HUD loader. Geometry + structural styles are injected from
       src/lib/hudGeometry.ts; colors resolve theme vars here so the splash
       matches the user's selected theme. ── */
    .splash-hud { width: 150px; height: 150px; }
    @keyframes hudCW { to { transform: rotate(360deg); } }
    @keyframes hudCCW { to { transform: rotate(-360deg); } }
    @keyframes hudBreathe { 0%, 100% { opacity: 0.55; } 50% { opacity: 1; } }
    .splash-hud g.hud-spin,
    .splash-hud .hud-breathe { transform-box: view-box; transform-origin: 100px 100px; }
    .splash-hud .hud-dim { stroke: var(--color-themeblue1, rgba(129, 161, 181, 1)); }
    .splash-hud .hud-bri { stroke: var(--color-themeblue2, rgba(21, 142, 172, 1)); }
    .splash-hud .hud-sweep { fill: var(--color-themeblue2, rgba(21, 142, 172, 1)); }
    .splash-hud .hud-glow-stop { stop-color: var(--color-themeblue2, rgba(21, 142, 172, 1)); }
    .splash-hud .hud-star { fill: var(--color-themeblue3, rgba(0, 66, 92, 1)); }
    [data-theme$="-dark"] .splash-hud .hud-star { fill: var(--color-themeblue1, rgba(129, 161, 181, 1)); }
    .splash-hud .hud-breathe { animation: hudBreathe 1.2s ease-in-out infinite; }
    @media (prefers-reduced-motion: reduce) {
      .splash-hud g.hud-spin { animation: none !important; }
      .splash-hud .hud-breathe { animation: none; opacity: 1; }
    }
  </style>
  <div id="splash" class="splash">
    <script>
      (function () {
        var t; try { t = localStorage.getItem('theme') } catch (e) { }
        // Resolve to a full theme id (name-mode). Migrate legacy 'light'/'dark',
        // fall back to default + system mode. Setting data-theme before the
        // splash paints lets it use the selected theme's --color-* vars (the
        // splash-theme-vars <style> the build injects provides them this early).
        if (t === 'light') t = 'default-light';
        else if (t === 'dark') t = 'default-dark';
        if (!t || !/-(light|dark)$/.test(t)) {
          t = window.matchMedia('(prefers-color-scheme:dark)').matches ? 'default-dark' : 'default-light';
        }
        document.documentElement.setAttribute('data-theme', t);
        // Update reload: skipWaiting() stamps postUpdateNav; silent/non-optional
        // updates stamp updateReloadPending. Either way, surface it so the reload
        // reads as an intentional patch, not a glitch. The silent flag has no other
        // consumer, so clear it here (postUpdateNav is cleared by App.tsx).
        try {
          if (localStorage.getItem('postUpdateNav') || localStorage.getItem('updateReloadPending')) {
            // Flag for main.tsx so the splash holds longer on a patch reload —
            // a sub-second flash reads as a glitch, not an intentional update.
            window.__patchReload = true;
            var st = document.getElementById('splash-subtitle');
            if (st) st.textContent = 'Applying patch…';
          }
          localStorage.removeItem('updateReloadPending');
        } catch (e) { }
      })();
    </script>
    <!-- HUD splash — inner markup injected at dev/build by the Vite plugin from
         src/lib/hudGeometry.ts (single source of truth, never drifts). -->
    <svg class="splash-hud" viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg"><!--HUD_SPLASH--></svg>
    <div class="splash-title"></div>
    <div class="splash-bar-track">
      <div class="splash-bar-fill"></div>
    </div>
    <div class="splash-subtitle" id="splash-subtitle"></div>
  </div>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
